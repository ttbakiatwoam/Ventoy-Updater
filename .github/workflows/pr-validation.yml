name: PR Validation

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ventoy-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Test, And Probe ISOs
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go build -o ventoy-update ./cmd/ventoy-update
      - run: ./ventoy-update validate --manifest examples/ventoy-update.yaml --timeout 90s --allow-skips --summary "$GITHUB_STEP_SUMMARY"
