name: PR Validation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ventoy-post-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Verify reviewed head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const number=Number(process.env.PR_NUMBER), headSha=process.env.HEAD_SHA;
            const {data:pr}=await github.rest.pulls.get({owner,repo,pull_number:number});
            if(pr.state!=='open'||pr.head.sha!==headSha||context.sha!==headSha){core.setFailed('Stale post-review dispatch.');return;}
            const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:number,per_page:100});
            const prefixes=[7,8,10,12].map((length)=>headSha.slice(0,length).toLowerCase());
            const codex=comments.some((comment)=>{
              if(comment.user?.login!=='chatgpt-codex-connector[bot]') return false;
              const body=comment.body||'', lower=body.toLowerCase();
              return body.includes('codex-pull-request-review-summary') &&
                /\\*\\*Completed\\*\\*/i.test(body) &&
                prefixes.some((prefix)=>lower.includes(`\`${prefix}\``));
            });
            const claude=comments.some((comment)=>{
              if(comment.user?.login!=='github-actions[bot]') return false;
              const body=comment.body||'';
              return body.includes('<!-- claude-pr-review-state -->') &&
                body.includes(`CLAUDE_REVIEW_HEAD: \`${headSha}\``) &&
                body.includes('CLAUDE_REVIEW_RESULT: CLEAN');
            });
            if(!codex||!claude) core.setFailed('Codex and Claude must both be clean on this exact head.');

  validate:
    name: Build, Test, And Probe ISOs
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go build -o ventoy-update ./cmd/ventoy-update
      - run: ./ventoy-update validate --manifest examples/ventoy-update.yaml --timeout 90s --allow-skips --summary "$GITHUB_STEP_SUMMARY"
